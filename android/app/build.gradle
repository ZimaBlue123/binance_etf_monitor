plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
// Chaquopy 不在 Gradle Plugin Portal, 必须用 buildscript classpath + apply 形式
apply plugin: 'com.chaquo.python'

android {
    namespace 'com.Mavis.binanceetfmonitor'
    compileSdk 34
    ndkVersion '25.2.9519653'

    defaultConfig {
        applicationId 'com.Mavis.binanceetfmonitor'
        minSdk 24
        targetSdk 34
        versionCode 7
        versionName '1.2.2'

        ndk {
            // 真实手机主流架构;x86/x86_64 主要给模拟器调试用
            abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    signingConfigs {
        release {
            def props = rootProject.ext.keystoreProperties
            if (props != null && !props.isEmpty()) {
                storeFile rootProject.file(props['storeFile'])
                storePassword props['storePassword']
                keyAlias props['keyAlias']
                keyPassword props['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
        }
    }

    packagingOptions {
        // Python 包里的 .a 文件不会冲突
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

// Chaquopy 配置 — 项目级扩展 `chaquopy`,把 Python + 必要 pip 包直接打进 APK
// 不指定 buildPython — 让 Chaquopy 用它自带的 Python 来构建 wheels。
// 钉版本号 — Chaquopy 17 的 PyPI 镜像只有 pandas 1.5.0 / 2.1.3,不能跨版本浮动
chaquopy {
    defaultConfig {
        pip {
            install "requests>=2.31,<3.0"
            install "PyYAML==6.0.3"
            install "pandas==2.1.3"
            install "urllib3>=2.0,<3.0"
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.work:work-runtime-ktx:2.9.0'
}
